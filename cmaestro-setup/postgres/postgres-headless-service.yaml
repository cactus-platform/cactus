apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: cmaestro-db
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres-db
      port: 5432
      targetPort: postgres-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cmaestro-db
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres-db
      port: 5432
      targetPort: postgres-db